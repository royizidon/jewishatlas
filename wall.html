<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Frank+Ruhl+Libre:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --page-bg: #110e0b;
  --header-bg: rgba(17, 14, 11, 0.96);
  --mortar: #241e18;
  --stone: #f2e7d6;
  --stone-dark: #e4d3bd;
  --gold: #c5a47e;
  --text-dark: #121417;
  --text-soft: rgba(232,228,220,0.55);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: radial-gradient(circle at 50% 0%, #1c1713 0%, #110e0b 55%, #0d0b09 100%);
  font-family: 'Inter', sans-serif;
  color: white;
  min-height: 100vh;
}

/* HEADER */
.site-header {
  position: sticky;
  top: 0;
  background: var(--header-bg);
  backdrop-filter: blur(12px);
  padding: 1.4rem 0 1rem;
  border-bottom: 1px solid rgba(197, 164, 126, 0.10);
  z-index: 100;
}
.nav-links {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.nav-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--text-soft);
  font-weight: 400;
}

.header-link {
  font-size: 0.7rem;
  text-decoration: none;
  color: var(--gold);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.25em;
  transition: opacity 0.2s;
}
.header-link:hover { opacity: 0.6; }
.search-section {
  max-width: 500px;
  margin: 1.6rem auto 0;
  padding: 0 20px;
}
.search-box input {
  width: 100%;
  background: rgba(242, 231, 214, 0.035);
  border: 1px solid rgba(197, 164, 126, 0.14);
  padding: 12px;
  color: white;
  text-align: center;
  font-size: 0.85rem;
  border-radius: 4px;
  outline: none;
  font-family: Inter, sans-serif;
}
.search-box input::placeholder { color: rgba(255,255,255,0.3); }

/* WALL */
.wall-outer-container {
  padding: 48px 20px 80px;
  display: flex;
  justify-content: center;
}
.wall-alcove {
  width: 100%;
  max-width: 1200px;
  background: var(--mortar);
  padding: 8px;
  box-shadow:
    0 40px 100px rgba(0,0,0,0.6),
    inset 0 2px 8px rgba(0,0,0,0.35),
    inset 0 -2px 8px rgba(0,0,0,0.2);
}
.wall-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 7px 7px;
}
/* Responsive columns */
@media (max-width: 1100px) { .wall-grid { grid-template-columns: repeat(5, 1fr); } }
@media (max-width: 860px)  { .wall-grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 640px)  { .wall-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 420px)  { .wall-grid { grid-template-columns: repeat(2, 1fr); } }

.brick {
  --stone-base: #f2e7d6;
  --stone-edge: #dfcdb5;
  --tilt: 0deg;
  background:
    radial-gradient(circle at 18% 30%,
      rgba(255,255,255,0.25) 0 2%,
      transparent 18%),
    radial-gradient(circle at 75% 65%,
      rgba(93,62,31,0.06) 0 3%,
      transparent 24%),
    linear-gradient(160deg,
      rgba(255,255,255,0.2),
      transparent 55%),
    linear-gradient(to bottom,
      var(--stone-base),
      var(--stone-edge));
  box-shadow:
    /* Top highlight edge */
    inset 0 2px 0 rgba(255,255,255,0.65),
    /* Left highlight edge */
    inset 2px 0 0 rgba(255,255,255,0.3),
    /* Bottom dark edge — main thickness illusion */
    inset 0 -4px 0 rgba(50,30,8,0.28),
    /* Right dark edge */
    inset -2px 0 0 rgba(50,30,8,0.16),
    /* Outer drop shadow — brick sitting proud of mortar */
    0 4px 8px rgba(0,0,0,0.35);

  height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transform: rotate(var(--tilt));
  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
}

/* Stable variation: the wall does not change every time it loads.
   Prime-number cycle (7n) so the pattern does NOT line up with the
   column count (6/5/4/3/2 across breakpoints) — avoids vertical banding.
   Each variant also gets its own subtle color, tilt, and grain offset so
   no two neighbouring stones look stamped from the same mould. */
.brick:nth-child(7n + 1) { --stone-base: #f3e8d8; --stone-edge: #dfcbb1; --tilt: -0.10deg; }
.brick:nth-child(7n + 2) { --stone-base: #eadcc8; --stone-edge: #d9c3a7; --tilt:  0.08deg; }
.brick:nth-child(7n + 3) { --stone-base: #f4eadb; --stone-edge: #e2d1ba; --tilt: -0.06deg; }
.brick:nth-child(7n + 4) { --stone-base: #eee0cc; --stone-edge: #dbc6aa; --tilt:  0.11deg; }
.brick:nth-child(7n + 5) { --stone-base: #f5ebdc; --stone-edge: #e3d2bb; --tilt: -0.08deg; }
.brick:nth-child(7n + 6) { --stone-base: #ecdec9; --stone-edge: #d7c1a5; --tilt:  0.07deg; }
.brick:nth-child(7n)     { --stone-base: #f1e5d3; --stone-edge: #ddc9ad; --tilt: -0.05deg; }

.brick:hover {
  filter: brightness(1.05);
  transform: translateY(-3px) rotate(var(--tilt));
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.65),
    inset 2px 0 0 rgba(255,255,255,0.3),
    inset 0 -4px 0 rgba(50,30,8,0.28),
    inset -2px 0 0 rgba(50,30,8,0.16),
    0 8px 16px rgba(0,0,0,0.42);
}

/* Fine stone grain — three sparse speckle gradients */
.brick::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.32;
  pointer-events: none;
  background:
    radial-gradient(circle at 12% 25%,
      rgba(65,42,20,0.10) 0 0.6px,
      transparent 1px),
    radial-gradient(circle at 68% 72%,
      rgba(255,255,255,0.30) 0 0.7px,
      transparent 1.2px),
    radial-gradient(circle at 84% 18%,
      rgba(65,42,20,0.08) 0 0.5px,
      transparent 1px);
  background-size: 19px 17px, 23px 21px, 29px 25px;
}
/* Shift the grain per variant so the speckle isn't identical stone-to-stone */
.brick:nth-child(7n + 1)::after { background-position: 0 0, 4px 8px, 11px 3px; }
.brick:nth-child(7n + 2)::after { background-position: 7px 3px, 1px 12px, 16px 7px; }
.brick:nth-child(7n + 3)::after { background-position: 3px 9px, 9px 2px, 5px 14px; }
.brick:nth-child(7n + 4)::after { background-position: 11px 5px, 3px 15px, 18px 1px; }
.brick:nth-child(7n + 5)::after { background-position: 5px 13px, 14px 6px, 2px 9px; }
.brick:nth-child(7n + 6)::after { background-position: 13px 7px, 6px 1px, 9px 17px; }
.brick:nth-child(7n)::after     { background-position: 9px 2px, 17px 10px, 4px 5px; }
.brick-name {
  position: relative;
  z-index: 1;
  font-family: 'Frank Ruhl Libre', 'Playfair Display', serif;
  font-weight: 700;
  font-size: 1.05rem;
  line-height: 1.15;
  color: var(--text-dark);
  direction: rtl;
  text-align: center;
  padding: 0 10px;
  white-space: normal;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  max-height: calc(1.15em * 2);
  text-shadow: 0 1px 0 rgba(255,255,255,0.3);
}

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 40px;
  color: rgba(255,255,255,0.3);
  font-size: 0.9rem;
  display: none;
}

/* MODAL */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(10px);
  z-index: 2000;
  align-items: center;
  justify-content: center;
}
.modal-backdrop.open { display: flex; }

.modal {
  background: linear-gradient(to bottom, var(--stone), var(--stone-dark));
  color: var(--text-dark);
  width: 90%;
  max-width: 520px;
  padding: 70px 50px;
  text-align: center;
  position: relative;
  border: 6px solid var(--mortar);
  box-shadow: 0 50px 120px rgba(0,0,0,0.65);
  border-radius: 6px;
}
.close-btn {
  position: absolute;
  top: 25px; right: 25px;
  cursor: pointer;
  opacity: 0.4;
  font-size: 22px;
  background: none;
  border: none;
  color: var(--text-dark);
}
.close-btn:hover { opacity: 0.7; }

.modal-he {
  font-family: 'Cormorant Garamond', serif;
  font-size: 3rem;
  font-weight: 900;
  direction: rtl;
  margin-bottom: 15px;
  line-height: 1.2;
}
.modal-en {
  font-size: 1.1rem;
  letter-spacing: 0.2em;
  color: var(--gold);
  margin-bottom: 35px;
  text-transform: uppercase;
}
.modal-divider {
  width: 30px;
  height: 1px;
  background: rgba(0,0,0,0.15);
  margin: 0 auto 24px;
}
.modal-dates-he {
  font-size: 1rem;
  opacity: 0.55;
  margin-bottom: 6px;
  direction: rtl;
}
.modal-dates-en {
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 16px;
}
.modal-origin {
  font-size: 1rem;
  margin-bottom: 36px;
  opacity: 0.6;
  direction: rtl;
  color: inherit;
  text-decoration: none;
  display: block;
}
.modal-origin-link {
  cursor: pointer;
  transition: opacity 0.2s;
}
.modal-origin-link:hover {
  opacity: 0.9;
  text-decoration: underline;
}
.modal-link {
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  font-weight: 600;
  color: var(--text-dark);
  text-decoration: none;
  border-bottom: 1px solid var(--gold);
  padding-bottom: 3px;
  transition: opacity 0.2s;
}
.modal-link:hover { opacity: 0.5; }

@media (max-width: 600px) {
  .nav-logo { display: none; }
  .modal-he { font-size: 2.4rem; }
  .modal { padding: 52px 28px 40px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-links">
    <a href="index.html" class="header-link">← The Map</a>
    <a href="index.html" class="nav-logo" style="text-decoration: none;">Jewish Atlas</a>
    <a href="dedicate.html" class="header-link">Add a Name</a>
  </div>
  <div class="search-section">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search Hebrew or English...">
    </div>
  </div>
</header>

<div class="wall-outer-container">
  <div class="wall-alcove">
    <main class="wall-grid" id="wall"></main>
  </div>
</div>
<div id="emptyState" class="empty-state">No memorials found.</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="close-btn" id="modalClose">✕</button>
    <div class="modal-he"       id="modalHe"></div>
    <div class="modal-en"       id="modalEn"></div>
    <div class="modal-divider"></div>
    <div class="modal-dates-he" id="modalDatesHe"></div>
    <div class="modal-dates-en" id="modalDatesEn"></div>
    <a class="modal-origin"   id="modalOrigin"></a>
    <div id="modalLinkContainer"></div>
  </div>
</div>

<script>
const API_BASE = "https://api.jewishatlas.org/api";
const MEMORIES_LAYER_URL = "https://services-eu1.arcgis.com/FckSU1kja7wbnBnq/arcgis/rest/services/JewishAtlas_Memories_Public_20260513_v5/FeatureServer/0";

const HARDCODED = [
  {
    he_name:       "משה כהן",
    eng_name:      "Moshe Cohen",
    born_str:      "תש״ס",
    death_str:     "תשפ״ג",
    born_display:  "1940",
    death_display: "2023",
    origin:        "ירושלים",
    tier:          "brick"
  },
  {
    he_name:       "חדוה הרכבי",
    eng_name:      "Hedva Harechavi",
    born_str:      "",
    death_str:     "",
    born_display:  "1941",
    death_display: "2025",
    origin:        "דגניה - ירושלים",
    tier:          "brick"
  },
  {
    he_name:       "ענר שפירא",
    eng_name:      "aner shapira",
    born_str:      'י"ז באדר תשס"א',
    death_str:     'כ"ב בתשרי תשפ"ד',
    born_display:  "2001",
    death_display: "2023",
    origin:        "ירושלים",
    tier:          "brick"
  },
  {
    he_name:       "מרים כהן",
    eng_name:      "Miriam Cohen",
    born_str:      "תרצ״ג",
    death_str:     "תשפ״א",
    born_display:  "1933",
    death_display: "2021",
    origin:        "חיפה",
    tier:          "brick"
  },
  {
    he_name:       "דוד שפירא",
    eng_name:      "David Shapira",
    born_str:      "תש״ה",
    death_str:     "תשפ״ב",
    born_display:  "1945",
    death_display: "2022",
    origin:        "פתח תקווה",
    tier:          "brick"
  },
   {
    he_name:       "משפחת ריבלין",
    eng_name:      "rivlin family",
    born_str:      "",
    death_str:     "",
    born_display:  "1630",
    death_display: "",
    origin:        "ירושלים",
    tier:          "brick"
  },

];

const wallEl      = document.getElementById("wall");
const searchInput = document.getElementById("searchInput");
const emptyState  = document.getElementById("emptyState");
const backdrop    = document.getElementById("modalBackdrop");

let allBricks = [];
let modalRequestId = 0;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[c])
  );
}

function renderBricks(data) {
  wallEl.innerHTML = "";
  if (!data.length) {
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";
  data.forEach(p => {
    const b = document.createElement("div");
    b.className = "brick";
    const name = p.he_name || p.eng_name || "";
    b.innerHTML = `<div class="brick-name">${esc(name)}</div>`;
    b.onclick = () => openModal(p);
    wallEl.appendChild(b);
  });
}

function formatGregorianDate(val) {
  if (!val) return "";

  const text = String(val).trim();

  // A year-only value should remain a year.
  if (/^\d{4}$/.test(text)) return text;

  // ISO: YYYY-MM-DD -> DD/MM/YYYY
  let match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:\D|$)/);
  if (match) {
    const [, year, month, day] = match;
    return `${day.padStart(2, "0")}/${month.padStart(2, "0")}/${year}`;
  }

  // European formats: DD/MM/YYYY or DD.MM.YYYY -> DD/MM/YYYY
  match = text.match(/^(\d{1,2})[/.](\d{1,2})[/.](\d{4})(?:\D|$)/);
  if (match) {
    const [, day, month, year] = match;
    return `${day.padStart(2, "0")}/${month.padStart(2, "0")}/${year}`;
  }

  // ArcGIS date fields may occasionally arrive as millisecond timestamps.
  if (/^\d{12,13}$/.test(text)) {
    const date = new Date(Number(text));
    if (!Number.isNaN(date.getTime())) {
      const day = String(date.getUTCDate()).padStart(2, "0");
      const month = String(date.getUTCMonth() + 1).padStart(2, "0");
      return `${day}/${month}/${date.getUTCFullYear()}`;
    }
  }

  // Preserve unexpected values rather than displaying a misleading fragment.
  return text;
}

function setModalOrigin(p, originText, hasExactLocation = false) {
  const originEl = document.getElementById("modalOrigin");
  originText = String(originText || "").trim();
  originEl.textContent = originText;

  // Prefer the exact Memories point. If there is no point, app.js can still
  // open the map by searching the displayed origin via the `place` parameter.
  let mapHref = "";
  if (originText) {
    mapHref = hasExactLocation && p.slug
      ? "index.html?memory=" + encodeURIComponent(p.slug)
      : "index.html?place=" + encodeURIComponent(originText);
  }

  if (mapHref) {
    originEl.href = mapHref;
    originEl.classList.add("modal-origin-link");
    const isMobile = window.matchMedia("(max-width: 768px)").matches;
    if (isMobile) {
      originEl.setAttribute("target", "_self");
      originEl.removeAttribute("rel");
    } else {
      originEl.setAttribute("target", "_blank");
      originEl.setAttribute("rel", "noopener");
    }
  } else {
    originEl.removeAttribute("href");
    originEl.classList.remove("modal-origin-link");
    originEl.removeAttribute("target");
    originEl.removeAttribute("rel");
  }
}

async function openModal(p) {
  const requestId = ++modalRequestId;
  document.getElementById("modalHe").textContent = p.he_name || "";
  document.getElementById("modalEn").textContent = p.eng_name || "";

  const datesHe = [p.born_str, p.death_str].filter(Boolean).join(" – ");
  document.getElementById("modalDatesHe").textContent = datesHe;

  const datesEn = [formatGregorianDate(p.born_display), formatGregorianDate(p.death_display)].filter(Boolean).join(" – ");
  document.getElementById("modalDatesEn").textContent = datesEn;

  // `origin` belongs to the Wall/Dedications layer. Exact location belongs
  // to the Memories layer, so it cannot be read from this wall record.
  setModalOrigin(p, p.origin, false);

  document.getElementById("modalLinkContainer").innerHTML =
    (p.tier === "page" && p.slug)
      ? `<a class="modal-link" href="/memory/${encodeURIComponent(p.slug)}/">VIEW FULL MEMORIAL PAGE</a>`
      : "";

  backdrop.classList.add("open");
  document.body.style.overflow = "hidden";

  // Check every slug against the public point layer. A matching visible
  // feature upgrades the origin-search link to an exact memory-point link.
  if (p.slug) {
    try {
      const params = new URLSearchParams({
        where: "slug='" + String(p.slug).replace(/'/g, "''") + "' AND show_on_map = 1",
        outFields: "location_label,show_on_map",
        returnGeometry: "false",
        f: "json"
      });
      const res = await fetch(MEMORIES_LAYER_URL + "/query?" + params);
      if (!res.ok) return;
      const data = await res.json();
      const memory = data.features?.[0]?.attributes || {};
      const locationText = String(memory.location_label || "").trim();

      // Ignore a late response if another brick was opened or the modal closed.
      if (requestId !== modalRequestId || !backdrop.classList.contains("open")) return;
      if (data.features?.length) {
        setModalOrigin(p, p.origin || locationText, true);
      }
    } catch (err) {
      console.error("Memory location lookup failed:", err);
    }
  }
}

function closeModal() {
  modalRequestId++;
  backdrop.classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("modalClose").onclick = closeModal;
backdrop.addEventListener("click", e => { if (e.target === backdrop) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { renderBricks(allBricks); return; }
  renderBricks(allBricks.filter(p =>
    (p.he_name  && p.he_name.includes(q)) ||
    (p.eng_name && p.eng_name.toLowerCase().includes(q))
  ));
});

async function loadWall() {
  allBricks = [...HARDCODED];
  renderBricks(allBricks);

  try {
    const res = await fetch(API_BASE + "/wall");
    if (!res.ok) throw new Error("API error");
    const data = await res.json();
    const features = (data.features || []).map(f => f.attributes);
    allBricks = [...HARDCODED, ...features];
    renderBricks(allBricks);
  } catch (err) {
    console.error("Wall API error:", err);
  }
}

loadWall();
</script>
</body>
</html>
