<!doctype html>
<!-- Generated by Jewish Atlas landmark SEO generator -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jewish Atlas location map</title><meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="https://js.arcgis.com/4.26/esri/themes/light/main.css">
<style>html,body,#map{height:100%;width:100%;margin:0}#status{position:absolute;bottom:0;left:0;background:white;padding:4px 8px;font:13px system-ui;z-index:2}</style>
<script src="./config.js"></script><script src="https://js.arcgis.com/4.26/"></script></head>
<body><div id="map" aria-label="Jewish Atlas nearby sites map"></div><div id="status" role="status">Loading map…</div>
<script>
require(['esri/Map','esri/views/MapView','esri/layers/FeatureLayer','esri/Graphic'], function(Map,MapView,FeatureLayer,Graphic){
 const p=new URLSearchParams(location.search), status=document.getElementById('status');
 const lat=p.get('lat')===null?NaN:Number(p.get('lat')), lon=p.get('lon')===null?NaN:Number(p.get('lon'));
 if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){status.textContent='Location unavailable';return;}
 const map=new Map({basemap:'topo-vector'});
 const view=new MapView({container:'map',map:map,center:[lon,lat],zoom:15,ui:{components:['zoom','attribution']}});
 if(window.LANDMARKS_SERVICE_URL){
   const layer=new FeatureLayer({url:window.LANDMARKS_SERVICE_URL,outFields:['id','main_category'],
     renderer:{type:'simple',symbol:{type:'simple-marker',size:8,color:'#39775f',outline:{color:'white',width:1}}}});
   map.add(layer);
   layer.load().catch(function(){status.textContent='Nearby sites unavailable; selected location shown.';});
 }else{status.textContent='Nearby sites unavailable; selected location shown.';}
 view.when(function(){
   view.graphics.add(new Graphic({geometry:{type:'point',longitude:lon,latitude:lat},symbol:{type:'simple-marker',size:15,color:'#c55336',outline:{color:'white',width:2}}}));
   if(status.textContent==='Loading map…')status.textContent='Orange: selected location · Green: nearby sites';
 }).catch(function(){status.textContent='Map unavailable. Please use the full map link.';});
});
</script></body></html>
